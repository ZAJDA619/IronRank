name: Streak reminders

on:
  schedule:
    # 18:00 UTC = 19:00 SEČ / 20:00 SELČ (letní čas). Uprav si podle sebe.
    - cron: '0 18 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notify-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
